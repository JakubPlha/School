<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technická podpora – VDF Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <header class="header">
            <h1 class="title">Technická podpora – VDF Games</h1>
            <p class="subtitle">Jak ti můžeme pomoct? Napiš, jaký máš problém.</p>
        </header>
        <form id="question-form" class="support-form" action="" method="post">
            <div class="form-group">
                <label for="dotaz" class="form-label">Tvůj dotaz:</label>
                <textarea id="question" name="dotaz" rows="5" placeholder="Např.: Po poslední aktualizaci..." class="form-control" required></textarea>
                </div>
                <div class="form-group">
                    <label for="email" class="form-label" id="email">E-mail (nepovinné):</label>
                    <input type="email" id="email" name="email" placeholder="tve@jmeno.cz" class="form-control">
                </div>
                <button type="submit" class="btn-submit">Odeslat dotaz</button>
            </form>
            <section class="response-section">
                <h2 class="response-title">Odpověď podpory:</h2>
                <div id="answer" class="response-box">
                    <p>Zatím žádný dotaz.</p>
                </div>
            </section>
        </main>
        <script src="script.js"></script>
    </body>
</html>
